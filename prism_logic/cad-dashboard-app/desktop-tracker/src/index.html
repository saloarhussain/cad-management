<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>CADONCE Tracker</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="logo">CADONCE</div>
      <p class="subtitle">Designer Workstation Tracker</p>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" />
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" />
      </div>
      
      <button id="loginBtn">Login</button>
      <p id="message" class="message"></p>
    </div>

    <script>
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');
      const message = document.getElementById('message');

      loginBtn.addEventListener('click', async () => {
        const email = emailInput.value;
        const password = passwordInput.value;
        
        if (!email || !password) {
          message.innerText = 'Please enter both email and password.';
          message.className = 'message error';
          return;
        }

        message.innerText = 'Logging in...';
        message.className = 'message info';
        
        const res = await window.electronAPI.login(email, password);
        
        if (res.success) {
          message.innerText = 'Login successful!';
          message.className = 'message success';
          // Here we would transition to the timer screen
          setTimeout(() => {
            document.querySelector('.login-container').innerHTML = `
              <div class="logo">CADONCE</div>
              <p class="subtitle">Active Session</p>
              
              <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-size: 9px;">Project ID</label>
                <input type="text" id="projectIdInput" placeholder="Enter Project ID" style="padding: 8px; font-size: 12px; background: #1c1a12; border: 1px solid #2a2a18; border-radius: 4px; color: #fff; width: 100%; box-sizing: border-box;" />
              </div>
              
              <div class="timer-box" style="padding: 10px; margin-bottom: 15px;">
                <span class="timer" id="timerDisplay" style="font-size: 24px;">00:00:00</span>
              </div>
              <button id="toggleBtn" class="success-btn">Start Shift</button>
              <p style="text-align: center; color: #888; font-size: 12px; margin-top: 10px;">Logged in as ${res.user.email}</p>
            `;

            const toggleBtn = document.getElementById('toggleBtn');
            const timerDisplay = document.getElementById('timerDisplay');
            const projectIdInput = document.getElementById('projectIdInput');
            let timerInterval = null;
            let seconds = 0;
            let isWorking = false;

            toggleBtn.addEventListener('click', async () => {
              if (!isWorking) {
                const projectId = projectIdInput.value.trim();
                if (!projectId) {
                  alert('Please enter a Project ID to start tracking!');
                  return;
                }
                
                // Start Tracking
                const trackRes = await window.electronAPI.startTracking(projectId);
                if (trackRes.success) {
                  isWorking = true;
                  toggleBtn.innerText = 'Stop Shift';
                  toggleBtn.className = 'error-btn';
                  
                  timerInterval = setInterval(() => {
                    seconds++;
                    const hrs = Math.floor(seconds / 3600).toString().padStart(2, '0');
                    const mins = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                    const secs = (seconds % 60).toString().padStart(2, '0');
                    timerDisplay.innerText = `${hrs}:${mins}:${secs}`;
                  }, 1000);
                }
              } else {
                // Stop Tracking
                const stopRes = await window.electronAPI.stopTracking();
                if (stopRes.success) {
                  isWorking = false;
                  toggleBtn.innerText = 'Start Shift';
                  toggleBtn.className = 'success-btn';
                  clearInterval(timerInterval);
                  alert(`Shift ended. Active time tracked: ${stopRes.activeSeconds} seconds.`);
                }
              }
            });
          }, 1000);
        } else {
          message.innerText = 'Error: ' + res.error;
          message.className = 'message error';
        }
      });
    </script>
  </body>
</html>
